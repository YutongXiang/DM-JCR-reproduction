# DM-JCR 复现项目统一配置
#
# [paper.*] 下的数值由论文明确给出；[assumptions.*] 和 [experiments.*]
# 下的数值是论文未给出确定值或实现细节时采用的复现方案。

[metadata]
schema_version = 1
paper_doi = "10.1109/TVT.2026.3656593"

[paper.system]
# 表 I 给出的场景规模上限。
max_vehicles = 100
max_uavs = 15
max_rsus = 20

[paper.channel]
wavelength_m = 0.1
blockage_probability = 0.3

[paper.task]
cpu_energy_coefficient = 5.0e-28
output_ratio_range = [0.01, 0.5]
forwarding_cycles_per_bit_range = [0.01, 0.2]

[paper.objective]
latency_weight = 0.5
energy_weight = 0.5

[paper.diffusion]
# 表 I、图 2及算法 1明确给出的扩散模型结构。
denoising_steps = 1000
image_size = 28
image_channels = 1
unet_feature_channels = [64, 128, 256]
convolution_kernel_size = 3
pooling_kernel_size = 2
upsampling_kernel_size = 2
deterministic_reverse_sampling = true
optimizer = "adam"

[paper.offloading]
link_quality_weight = 0.3
cpu_load_weight = 0.2
bandwidth_load_weight = 0.15
power_load_weight = 0.15
latency_risk_weight = 0.2
hysteresis_threshold = 0.1

[assumptions.units]
# 论文使用 KB，但未说明采用十进制还是二进制定义。
bytes_per_kilobyte = 1000

[assumptions.mobility]
# 公式（4）至（5）包含移动噪声，但未给出其分布。
noise_distribution = "zero_mean_independent_gaussian"
boundary_policy = "clip"

[assumptions.channel]
# 论文指定了 Rayleigh/Rician 衰落，但未给出以下分布细节。
thermal_noise_density_dbm_hz = -174.0
receiver_noise_figure_db = 0.0
rician_k_factor_db = 6.0
los_additional_loss_db = [0.0, 3.0]
blocked_additional_loss_db = [10.0, 30.0]
default_interference_power_w = 0.0
default_link_available = true

[assumptions.objective]
# 论文说明时延和能耗需要归一化，但省略了具体公式。
latency_normalization = "per_task_deadline"
energy_reference_j = 10.0

[assumptions.relay_accounting]
# 论文未说明四跳链路如何共享同一节点的带宽预算。
bandwidth_policy = "charge_v2u_u2n_u2v_to_relay_and_n2u_to_compute_node"
relay_power_policy = "reuse_one_relay_power_for_both_outbound_hops"

[assumptions.tensor]
# 论文没有规定扩散模型输入/输出张量的补零上限和归一化方式。
# 节点上限来自表 I；其余数值是本复现采用的固定编码约定。
max_tasks = 150
position_scale_m = 1000.0
speed_scale_mps = 20.0
bandwidth_scale_hz = 4.0e8
cpu_scale_hz = 3.0e9
power_scale_w = 70.0
task_bits_scale = 4.0e6
task_cycles_scale = 1.0e10
latency_scale_s = 1.0
channel_gain_scale = 1.0e-7

[assumptions.dataset_generation]
# 论文没有公开训练数据生成程序，以下范围用于构造可重复的多场景样本。
vehicle_count_range = [4, 8]
uav_count_range = [2, 3]
rsu_count_range = [1, 2]
task_count_range = [3, 6]
area_size_m = [1000.0, 1000.0]
uav_altitude_range_m = [50.0, 150.0]
vehicle_speed_range_mps = [5.0, 20.0]
uav_speed_range_mps = [0.0, 10.0]
remaining_resource_fraction_range = [0.6, 1.0]
uav_bandwidth_range_hz = [8.0e7, 1.5e8]
rsu_bandwidth_range_hz = [1.0e8, 4.0e8]
uav_cpu_range_hz = [1.0e9, 2.0e9]
rsu_cpu_range_hz = [2.0e9, 3.0e9]
uav_power_range_w = [20.0, 40.0]
rsu_power_range_w = [40.0, 70.0]
task_input_bits_range = [4.0e5, 2.0e6]
task_cpu_cycles_range = [1.0e8, 2.0e9]
task_latency_range_s = [1.0, 5.0]
task_mode_probabilities = [0.4, 0.35, 0.25]
ensure_all_task_modes = true
vehicle_transmit_power_w = 0.2
forwarding_cycles_per_bit = 0.1
nominal_bandwidth_hz = 1.0e7
vehicle_antenna_gain_db = 5.0
uav_antenna_gain_db = 10.0
rsu_antenna_gain_db = 10.0

[assumptions.strategy_search]
# 标签是候选搜索得到的高质量可行策略，不宣称是全局最优解。
candidate_count = 64
log_score_std = 1.0
minimum_score = 0.05
maximum_score = 20.0
deadline_violation_penalty = 2.0
require_feasible_label = true
maximum_scenario_attempts = 20

[assumptions.diffusion]
# 论文未公开以下训练细节；这些值是可修改且被明确标记的复现假设。
beta_schedule = "linear"
beta_start = 1.0e-4
beta_end = 2.0e-2
environment_categories = 8
environment_preprocessing = "per_feature_standardization"
kmeans_n_init = 10
classifier_hidden_sizes = [256, 128]
classifier_dropout = 0.2
autoencoder_hidden_sizes = [256, 512]
model_max_tasks = 6
time_embedding_size = 128
condition_injection = "time_and_class_embedding_added_per_unet_block"
positive_output_transform = "softplus"
loss_delta = 1.0
random_strategy_range = [0.05, 1.0]
classifier_learning_rate = 1.0e-3
autoencoder_learning_rate = 1.0e-3
diffusion_learning_rate = 1.0e-4
classifier_epochs = 50
autoencoder_epochs = 100
diffusion_epochs = 50
batch_size = 8
gradient_clip_norm = 1.0
gradient_checkpointing = true

[experiments.dataset_generation]
random_seed = 2026
train_samples = 64
validation_samples = 16
test_samples = 16
output_directory = "outputs/diffusion_dataset"

[experiments.dynamic_channel]
number_of_slots = 100
time_step_s = 1.0
random_seed = 2026
vehicle_mobility_noise_std_m = 0.15
uav_mobility_noise_std_m = 0.05
# 以下参数仅用于演示。尤其是 vehicle_gain_db=3，低于论文给出的 5—10 dBi
# 车辆增益范围，因此不能视为论文指定值。
vehicle_gain_db = 3.0
uav_gain_db = 3.0
bandwidth_hz = 1.0e7
transmit_power_w = 0.2
smoothing_window = 9
output_csv = "outputs/dynamic_channel.csv"
output_figure = "outputs/dynamic_channel_trend.png"

[experiments.dynamic_channel.initial_vehicle]
position_m = [0.0, 0.0, 0.0]
velocity_mps = [12.0, 0.5, 0.0]

[experiments.dynamic_channel.initial_uav]
position_m = [600.0, 100.0, 100.0]
velocity_mps = [-0.5, 0.2, 0.0]

[experiments.dynamic_channel.vehicle_bounds]
minimum_m = [0.0, -200.0, 0.0]
maximum_m = [1200.0, 400.0, 0.0]

[experiments.dynamic_channel.uav_bounds]
minimum_m = [0.0, -200.0, 50.0]
maximum_m = [1200.0, 400.0, 150.0]

